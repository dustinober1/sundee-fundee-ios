name: SundeeFundee
options:
  bundleIdPrefix: com.sundeefundee
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "87VVCMCW3F"
    MARKETING_VERSION: "1.6.3"
    CURRENT_PROJECT_VERSION: 10
    APP_GROUP_IDENTIFIER: group.com.sundeefundee.shared

packages:
  SundeeFundeeKit:
    path: ../SundeeFundee

targets:
  SundeeFundee:
    type: application
    platform: iOS
    sources:
      - SundeeFundee
    dependencies:
      - package: SundeeFundeeKit
      - target: SundeeFundeeWidgetsExtension
        embed: true
    settings:
      base:
        INFOPLIST_FILE: SundeeFundee/Info.plist
        CODE_SIGN_ENTITLEMENTS: SundeeFundee/SundeeFundee.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.sundeefundee.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
    postCompileScripts: []

  SundeeFundeeWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - SundeeFundeeWidgets
    dependencies:
      - package: SundeeFundeeKit
    settings:
      base:
        INFOPLIST_FILE: SundeeFundeeWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: SundeeFundeeWidgets/SundeeFundeeWidgets.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.sundeefundee.app.widgets
        PRODUCT_NAME: SundeeFundeeWidgetsExtension
        GENERATE_INFOPLIST_FILE: false
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true

  SundeeFundeeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../SundeeFundee/Tests/SundeeFundeeKitTests
    dependencies:
      - package: SundeeFundeeKit
      - target: SundeeFundee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundeefundee.app.tests
        GENERATE_INFOPLIST_FILE: true

  SundeeFundeeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SundeeFundeeUITests
    dependencies:
      - target: SundeeFundee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundeefundee.app.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: SundeeFundee
