name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private shared package
        uses: actions/checkout@v4
        with:
          repository: dustinober1/sundee-fundee-shared
          token: ${{ secrets.PAT_TOKEN || github.token }}
          path: SundeeFundee/Packages/SundeeFundeeShared
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --quiet

      - name: Build
        run: |
          xcodebuild build \
            -project SundeeFundee.xcodeproj \
            -scheme SundeeFundee \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || cat

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project SundeeFundee.xcodeproj \
            -scheme SundeeFundee \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -only-testing:SundeeFundeTests \
            -enableCodeCoverage YES \
            -resultBundlePath SundeeFundeeTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || cat

      - name: Enforce 100% app line coverage
        run: |
          RESULT_BUNDLE_PATH="SundeeFundeeTests.xcresult"
          if [ ! -d "$RESULT_BUNDLE_PATH" ]; then
            echo "::error::Expected result bundle not found at $RESULT_BUNDLE_PATH"
            exit 1
          fi

          xcrun xccov view --report --json "$RESULT_BUNDLE_PATH" > xccov-report.json

          python3 - <<'PY'
          import json
          import sys

          target_name = "SundeeFundee.app"
          required_line_coverage = 1.0

          with open("xccov-report.json", "r", encoding="utf-8") as f:
              report = json.load(f)

          target = next((t for t in report.get("targets", []) if t.get("name") == target_name), None)
          if not target:
              print(f"::error::Target '{target_name}' not found in xccov report.")
              sys.exit(1)

          line_coverage = target.get("lineCoverage")
          if line_coverage is None:
              print(f"::error::lineCoverage missing for target '{target_name}'.")
              sys.exit(1)

          percent = line_coverage * 100
          print(f"{target_name} line coverage: {percent:.2f}%")
          if line_coverage < required_line_coverage:
              print(f"::error::{target_name} line coverage {percent:.2f}% is below required 100.00%.")
              sys.exit(1)
          PY
