name: TestFlight

on:
  push:
    tags:
      - "v*"          # e.g. v1.0.0
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI
    inputs:
      notes:
        description: "TestFlight release notes"
        required: false
        default: "New build."

jobs:
  build-and-upload:
    name: Build & Upload to TestFlight
    runs-on: macos-15   # Xcode 16+ required for Swift 6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for build number increment

      - name: Checkout SundeeFundeeShared
        uses: actions/checkout@v4
        with:
          repository: dustinober1/sundee-fundee-shared
          path: SundeeFundee/Packages/SundeeFundeeShared
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true  # Runs `bundle install` and caches gems

      - name: Generate Xcode project
        run: bundle exec xcodegen generate

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project SundeeFundee.xcodeproj \
            -scheme SundeeFundee \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -only-testing:SundeeFundeTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Build & Upload to TestFlight
        env:
          # App Store Connect API (generate at appstoreconnect.apple.com → Users → Keys)
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}

          # Developer account
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # Fastlane Match (certificate management)
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

          # Optional: TestFlight notes
          TESTFLIGHT_NOTES: ${{ github.event.inputs.notes || 'New build.' }}

          # CI flag — tells match to use readonly mode
          CI: true

        run: bundle exec fastlane beta
