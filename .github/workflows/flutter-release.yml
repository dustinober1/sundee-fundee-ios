name: Flutter Release Builds

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-release.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-release.yml'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  build-web:
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build web release
        run: flutter build web --release --dart-define=ENABLE_FIREBASE=true
      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: flutter_app/build/web/
          retention-days: 30

  build-android:
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android AAB
        run: flutter build appbundle --release --dart-define=ENABLE_FIREBASE=true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    needs: quality
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: Build iOS App (unsigned)
        run: flutter build ios --release --no-codesign --dart-define=ENABLE_FIREBASE=true
      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: flutter_app/build/ios/iphoneos/Runner.app
          retention-days: 30
