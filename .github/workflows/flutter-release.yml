name: Flutter Release Builds

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-release.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-release.yml'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  quality-integration:
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Run critical access integration test on Linux desktop
        run: |
          xvfb-run flutter test integration_test/critical_access_flow_test.dart -d linux -r expanded
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-integration-logs
          path: |
            flutter_app/test-output
          if-no-files-found: warn
          retention-days: 30

  build-web:
    needs: [quality, quality-integration]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build web release
        run: flutter build web --release --dart-define=ENABLE_FIREBASE=true
      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: flutter_app/build/web/
          retention-days: 30

  build-android:
    needs: [quality, quality-integration]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android AAB
        run: flutter build appbundle --release --dart-define=ENABLE_FIREBASE=true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    needs: [quality, quality-integration]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: Build iOS IPA (unsigned)
        run: flutter build ipa --release --no-codesign --dart-define=ENABLE_FIREBASE=true
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: flutter_app/build/ios/ipa/
          retention-days: 30
