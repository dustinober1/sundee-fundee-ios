name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: 34
  ANDROID_BUILD_TOOLS: 34.0.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew
      
      - name: Run lint
        run: cd android && ./gradlew lint
      
      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: android/app/build/reports/lint-results*.html

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew
      
      - name: Run unit tests
        run: cd android && ./gradlew testDebugUnitTest
      
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: android/app/build/reports/tests/testDebugUnitTest/*.html

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Create local.properties
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      
      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew
      
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Create local.properties
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      
      - name: Create secrets.properties
        run: |
          cd android
          echo "STORE_FILE=${{ secrets.STORE_FILE }}" | base64 -d > app/secrets.properties
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> app/secrets.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> app/secrets.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> app/secrets.properties
      
      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew
      
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease
      
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk
