<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline — Sundee Fundee</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #0D1A40;
        color: #F4F0DF;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }

      .logo {
        margin-bottom: 32px;
        opacity: 0.9;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin-bottom: 12px;
        color: #F4F0DF;
      }

      p {
        font-size: 1rem;
        line-height: 1.6;
        color: #c8c2aa;
        margin-bottom: 32px;
        max-width: 320px;
      }

      button {
        background-color: #F2731A;
        color: #F4F0DF;
        border: none;
        border-radius: 8px;
        padding: 14px 32px;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      button:hover {
        opacity: 0.88;
      }

      button:active {
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <!-- Simplified lightning bolt logo (sRGB colors for broad browser compatibility) -->
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="56" height="54" fill="none" viewBox="0 0 48 46" aria-hidden="true">
        <path fill="#863bff" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>
      </svg>
    </div>

    <h1>You're currently offline</h1>
    <p>Check your connection and try again.</p>

    <button type="button" onclick="window.location.reload()">Try Again</button>
  </body>
</html>
