name: SundeeFundee
options:
  bundleIdPrefix: com.sundeefundee
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

packages:
  SundeeFundeeKit:
    path: ../SundeeFundee

targets:
  SundeeFundee:
    type: application
    platform: iOS
    sources:
      - SundeeFundee
    dependencies:
      - package: SundeeFundeeKit
    settings:
      base:
        INFOPLIST_FILE: SundeeFundee/Info.plist
        CODE_SIGN_ENTITLEMENTS: SundeeFundee/SundeeFundee.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.sundeefundee.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
    postCompileScripts: []
