name: SundeeFundee
options:
  bundleIdPrefix: com.sundeefundee
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  SundeeFundee:
    type: application
    platform: iOS
    sources:
      - path: SundeeFundee
        excludes:
          - "**/.DS_Store"
    resources:
      - path: SundeeFundee/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundeefundee.app
        INFOPLIST_FILE: SundeeFundee/Info.plist
        CODE_SIGN_ENTITLEMENTS: SundeeFundee/SundeeFundee.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Sundee Fundee"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: SundeeFundee/SundeeFundee.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.sundeefundee.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.applesignin:
          - Default

  SundeeFundeeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SundeeFundeeTests
    dependencies:
      - target: SundeeFundee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundeefundee.app.tests
        GENERATE_INFOPLIST_FILE: YES

  SundeeFundeeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SundeeFundeeUITests
    dependencies:
      - target: SundeeFundee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundeefundee.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SundeeFundee
