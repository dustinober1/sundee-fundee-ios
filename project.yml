name: SundeeFundee
options:
  bundleIdPrefix: com.sundeefundee
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only
    DEVELOPMENT_TEAM: ""         # Set your team ID before building
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SundeeFundee:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SundeeFundee
        excludes:
          - "**/*.md"
    resources:
      - path: SundeeFundee/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundeefundee.app
        INFOPLIST_FILE: SundeeFundee/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SundeeFundee/Resources/SundeeFundee.entitlements
        SWIFT_VERSION: "6.0"
    entitlements:
      path: SundeeFundee/Resources/SundeeFundee.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.sundeefundee.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.applesignin:
          - Default
    info:
      path: SundeeFundee/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sundee Fundee
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: "Sundee Fundee uses health data to provide cycle-aware training recommendations."
        NSHealthUpdateUsageDescription: "Sundee Fundee writes workout data to Apple Health."
    dependencies:
      - sdk: CloudKit.framework

  SundeeFundeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SundeeFundeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundeefundee.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SundeeFundee
