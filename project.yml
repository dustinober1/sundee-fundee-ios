name: SundeeFundee
options:
  bundleIdPrefix: com.sundeefundee
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only
    DEVELOPMENT_TEAM: "87VVCMCW3F"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  SundeeFundeeShared:
    path: SundeeFundee/Packages/SundeeFundeeShared

targets:
  SundeeFundee:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SundeeFundee
        excludes:
          - "**/*.md"
          - Packages
    resources:
      - path: SundeeFundee/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundeefundee.app
        INFOPLIST_FILE: SundeeFundee/Resources/Info.plist
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: SundeeFundee/Resources/SundeeFundee.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: SundeeFundee/Resources/SundeeFundee.entitlements
    info:
      path: SundeeFundee/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sundee Fundee
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: "Sundee Fundee uses health data to provide cycle-aware training recommendations."
        NSHealthUpdateUsageDescription: "Sundee Fundee writes workout data to Apple Health."
    dependencies:
      - package: SundeeFundeeShared
      - sdk: CloudKit.framework
      - sdk: HealthKit.framework

  SundeeFundeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SundeeFundeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundeefundee.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SundeeFundee
